name: Tests

on:
  push:
    branches: [master, devel]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Las dos que se anuncian en el README. Se prueban las dos porque
      # anunciar una versión que no se ejecuta nunca es una promesa a ciegas.
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      # La suite no toca la red ni el $HOME real: `tests/conftest.py` monta un
      # sandbox antes de importar nada de `puntueitor`, y `pytest_configure`
      # se niega a arrancar si ese aislamiento no está puesto.
      - name: Tests
        run: python -m pytest -q
